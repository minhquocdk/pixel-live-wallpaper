# Builds the live wallpaper on GitHub's machines, so no Android toolchain is needed on yours.
#
# Every push and pull request builds and tests the island engine and packages the wallpaper; the APK comes out as a
# downloadable artifact of the run. A nightly build is thrown in so the artifacts are always there to grab even on a
# quiet repository, and a release is published when a tag v* is pushed.
name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # only used when a tag is pushed, to attach the APK to the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Make the wrapper runnable
        run: chmod +x gradlew

      - name: Grow an island and check it against the almanac
        run: ./gradlew :core:test --console=plain 2>&1 | tee /tmp/build.log

      - name: Say what the compiler said
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'The build stopped. The tail of its log:'
            echo '```'
            tail -c 7000 /tmp/build.log || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Draw a still of the island
        run: |
          ./gradlew :core:preview --console=plain \
            --args="--seed heron-bay-8 --t 13.05 --fixed-day --tod 0.3 --out $GITHUB_WORKSPACE/android/island.png --scale 2"

      - name: Draw the Rift, by day and by night
        run: |
          ./gradlew :core:preview --console=plain \
            --args="--seed twin-rivers-8 --theme rift --size 307x682 --tod 0.30 --out $GITHUB_WORKSPACE/android/rift-day.png --scale 2 --frames 4" \
            | tee /tmp/rift-day.txt
          ./gradlew :core:preview --console=plain \
            --args="--seed twin-rivers-8 --theme rift --size 307x682 --tod 0.80 --out $GITHUB_WORKSPACE/android/rift-night.png --scale 2 --frames 4" \
            | tee /tmp/rift-night.txt

      - name: Build the wallpaper
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Name the APKs
        run: |
          mkdir -p /tmp/apk
          cp app/build/outputs/apk/debug/*.apk /tmp/apk/island-live-wallpaper-debug.apk
          cp app/build/outputs/apk/release/*.apk /tmp/apk/island-live-wallpaper-release.apk
          ls -l /tmp/apk

      - name: Hand over the APKs
        uses: actions/upload-artifact@v7
        with:
          name: island-live-wallpaper
          path: /tmp/apk/*.apk
          if-no-files-found: error

      - name: Hand over the still
        uses: actions/upload-artifact@v7
        with:
          name: island-still
          path: android/island.png
          if-no-files-found: error

      - name: Hand over the Rift stills
        uses: actions/upload-artifact@v7
        with:
          name: rift-stills
          path: |
            android/rift-day.png
            android/rift-night.png
          if-no-files-found: error

      - name: Keep the Rift's stills in the branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p docs
          cp "$GITHUB_WORKSPACE/android/rift-day.png" docs/rift-day.png
          cp "$GITHUB_WORKSPACE/android/rift-night.png" docs/rift-night.png
          { echo "The engine's own numbers, as the build drew them (307 x 682, the frame a 20:9 phone gets):"; echo; echo '```'; grep -hE "^rift " /tmp/rift-day.txt /tmp/rift-night.txt; echo '```'; } > docs/rift-report.md
          git add docs/rift-day.png docs/rift-night.png docs/rift-report.md
          if git diff --cached --quiet; then echo "the stills are as the branch already has them"; exit 0; fi
          git commit -m "docs: the Rift's stills and numbers, as the engine drew them"
          git push origin "HEAD:$BRANCH"

      - name: Hand over the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: island-live-wallpaper
          path: apk
      - uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
